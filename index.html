<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>LAYOUT</title>
    <style>
*{
    margin: 0%;
    padding: 0%;
    box-sizing: border-box;
}
body{
    border:5px solid gray;
    margin: 0;
    height: 100vh;
}
.container{
    height: 100%;
   width:100%;
    background:#d7eef9;
     padding: 10px;
     margin: 0;
}
.box1,.box2,.box4,.middle{
    margin-bottom: 10px;
}
.box1,.box2,.box4{

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 10px;
    font-size: xx-large;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

.box1,.box2,.box4{
    height:100px ;
    
}
.box1,.box4{
    background-color: rgba(25, 180, 178, 0.379);
}
.box2{
    background-color: rgb(77, 211, 86);
}
.box3{

    height: 315px;
    /* margin: 15px; */
}
.middle{
    display:flex;
    gap:15px;
    align-items: stretch;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    font-size: xx-large;
}


.aside,.content,.section{
    display: flex;
    align-items: center;
    justify-content: center;
     gap: 15px;
}
.aside{
    background-color: rgba(37, 244, 37, 0.751);
    height: 315px;
    width: 30%;
     
}
.aside2{
     height: 315px;
    width: 70%;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.content{
    width: 100%;
    height: 157.5px;
    background-color: rgb(29, 192, 237);
}
.section{
     width: 100%;
    height: 157.5px;
    background-color: rgba(55, 101, 239, 0.518);
    
}
    </style>
</head>
<body>
    <div class="container">
  <div class="box1">Header</div>
  <div class="box2">Navigation</div>
  <div class="box3">
<div class="middle"> 
    <div class="aside"> Aside</div>
    <div class="aside2">
        <div class="content">Content</div>
        <div class="section">Section</div>
</div>
</div>
</div>
<div class="box4">Footer</div>
</div>
</body>
</html>
